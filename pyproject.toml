[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepwm"
version = "1.1.0"
description = "Multimodal sleep state completion and forecasting under partial observation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.8", "PyYAML>=6.0", "scikit-learn>=1.0", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["sleepwm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
