[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepwm"
version = "1.0.0"
description = "Reliability-aware physiological world modeling under dynamic partial observation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "PyYAML>=6.0",
  "scikit-learn>=1.0",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
data = ["mne>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
