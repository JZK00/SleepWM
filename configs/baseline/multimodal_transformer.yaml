experiment:
  id: B2_multimodal_transformer
  kind: baseline
  seed: 20260804

data:
  manifest_path: ../data/manifests/hmc_processed_manifest.csv
  stored_modalities: [EEG, ECG, EMG]
  modalities: [EEG, ECG, EMG]
  sample_rate: 128
  epoch_seconds: 30
  num_classes: 5

model:
  name: transformer
  patch_samples: 64
  d_model: 128
  layers: 4
  heads: 4
  dropout: 0.10

train:
  epochs: 30
  batch_size: 128
  num_workers: 4
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  class_weighting: balanced
  device: cuda
  output_dir: outputs/B2_multimodal_transformer

